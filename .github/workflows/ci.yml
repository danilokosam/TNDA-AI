name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    name: Typecheck, lint, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installs pnpm (matching the root package.json's packageManager field)
      # and Node.js in one step - Node is needed for pnpm itself and for the
      # frontend's build tooling. The backend's own scripts still run under
      # Bun (set up separately below), which is what actually executes them.
      - name: Set up pnpm + Node
        uses: pnpm/setup@v2
        with:
          runtime: node@22
          install: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails the build on any high-or-critical advisory in the resolved
      # dependency tree (via the npm registry's advisory database). Pinned
      # to high+ deliberately, not pnpm audit's moderate default: this repo
      # currently carries one pre-existing moderate advisory (`file-type`,
      # GHSA-5v7r-6r5c-r473, an ASF-parser infinite loop — irrelevant to
      # this app's supported document types) that moderate would fail on
      # unconditionally. High/critical is the bar this policy actually
      # guarantees catches something worth blocking a merge over; anything
      # below that is visible by running `pnpm audit` locally but doesn't
      # block CI on its own.
      - name: Dependency vulnerability scan
        run: pnpm audit --audit-level=high

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
